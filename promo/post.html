<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fright Night Instagram Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="promo.css">
  </head>
  <body>
    <main class="stage">
      <article class="artboard post">
        <div class="background post-bg"></div>
        <div class="shade"></div>
        <div class="copy">
          <p class="kicker">MYAC Connect presents</p>
          <h1>Fright Night</h1>
          <p class="tagline">Games · Prizes · Snacks</p>
          <div class="details">
            <span>October 30th, 2026</span>
            <span>6:30-8:30 PM</span>
          </div>
          <p class="footer">Halloween themed. Costumes welcome.</p>
        </div>
      </article>
    </main>
  </body>
</html>
